<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cleaning Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

body {
  background: #f3f3f3;
  padding: 40px;
}

.card-wrapper {
  display: flex;
  gap: 30px;
  justify-content: center;
  flex-wrap: wrap;
}

.service-card {
  width: 360px;
  background: #fff;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  transition: 0.3s;
  position: relative;
}

.service-card:hover {
  transform: translateY(-5px);
}

.service-card img {
  width: 100%;
  height: 230px;
  object-fit: cover;
}

.card-content {
  padding: 30px;
}

.small-title {
  color: #17a34a;
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 10px;
}

.main-title {
  font-size: 36px;
  font-weight: 700;
  color: #0b2b35;
  line-height: 1.2;
  margin-bottom: 20px;
}

.line {
  width: 100%;
  height: 2px;
  border-bottom: 2px dashed #cfcfcf;
  position: relative;
  margin-bottom: 25px;
}

.line::after {
  content: "";
  position: absolute;
  right: 0;
  top: -2px;
  width: 55px;
  height: 6px;
  background: #18a64a;
}

.description {
  color: #666;
  font-size: 18px;
  line-height: 1.7;
}

.active-card {
  border-bottom: 8px solid #18a64a;
}
</style>
</head>
<body>

<div class="card-wrapper">

  <div class="service-card">
    <img src="https://images.unsplash.com/photo-1581578731548-c64695cc6952" alt="Home Service">

    <div class="card-content">
      <div class="small-title">CLEANING 01</div>
      <div class="main-title">HOME SERVICE</div>

      <div class="line"></div>

      <p class="description">
        sweep & mopsd vacuum floor House Cleaners.
      </p>
    </div>
  </div>

  <div class="service-card active-card">
    <img src="https://images.unsplash.com/photo-1600566752227-8f3b8b7b0c55" alt="Kitchen Clean">

    <div class="card-content">
      <div class="small-title">CLEANING 01</div>
      <div class="main-title">KITCHEN CLEAN</div>

      <div class="line"></div>

      <p class="description">
        sweep & mopsd vacuum floor House Cleaners.
      </p>
    </div>
  </div>

</div>

</body>
</html>
